      spark: { serve: mistralai/Devstral-Small-2-24B-Instruct-2512, args: [--max-model-len, '40960', --gpu-memory-utilization, '0.80'], max_concurrency: null }
      mac: { serve: mlx-community/Devstral-Small-2-24B-Instruct-2512-4bit, weights: MLX 4-bit, weights_gb: 15.1 }

