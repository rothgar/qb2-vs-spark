  # DeepSeek-V4.1-Flash (552B MoE) runs on qb2 from bfp4 experts paged from NVMe, one sequence at a time
  # (rothgar/deepseek-v4.1-flash-p300x2). Its decode cost grows with the served context, so the long-prompt test
  # uses a separate entry with the 32K profile.
  - id: deepseek-v4.1-flash
    hf_id: deepseek-ai/DeepSeek-V4.1-Flash
    arch: MoE
    params_b: { total: 552, active: 16 }
    weights: BFP4 experts
    quality: { aa_index: 39, variant: Max (reasoning), version: v4.3.2, url: "https://artificialanalysis.ai/models/deepseek-v4-1-flash" }
    max_concurrency: 1
    workloads: [chat, codegen, agent-turn, power]
