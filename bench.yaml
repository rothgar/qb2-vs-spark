  - id: deepseek-v4.1-flash-long
    same_as: deepseek-v4.1-flash
    chart: false
    hf_id: deepseek-ai/DeepSeek-V4.1-Flash
    max_concurrency: 1
    workloads: [agent-long]
    prompts_per_concurrency: 2
    min_prompts: 2
    per_machine:
      qb2: { serve: rothgar/deepseek-v4.1-flash-p300x2, profile: p300x2-32k }

# Prompt (ISL) and output (OSL) lengths in tokens, shaped like coding-agent traffic.
workloads:
  - { name: chat,        isl: 128,   osl: 256,  concurrency: [1, 4] }
  - { name: codegen,     isl: 1024,  osl: 1024, concurrency: [1, 4] }
  - { name: agent-turn,  isl: 8192,  osl: 512,  concurrency: [1, 4] }
  - { name: agent-long,  isl: 32768, osl: 256,  concurrency: [1] }
  # concurrent-user scaling: how per-user decode and total throughput trade off as users are added
  - { name: users,       isl: 1024,  osl: 256,  concurrency: [1, 2, 4, 8, 16, 32], prompts_per_concurrency: 3 }
  # tokens per joule: long enough (minutes) to average the plugs' 1 s samples; runs only when named (-w power)
  - { name: power,       isl: 1024,  osl: 512,  concurrency: [1, 16, 32], prompts_per_concurrency: 2, enabled: false }
  # long context, prefill-heavy (coding agents on a large codebase, research over documents), with wall power:
  # `prefill` sends a fresh 16K-token prompt every time; `prefill-cached` sends the same 16K prompt with only the
  # last 512 tokens new, the way an agent resends its context each turn, so servers that cache prefixes skip most
  # of the prefill (the shared prefix is sent once, unmeasured, before the first point). Both run only when named.
  - { name: prefill,        isl: 16384, osl: 256, concurrency: [1, 4, 8], prompts_per_concurrency: 2, enabled: false }
  - { name: prefill-cached, isl: 16384, prefix: 15872, osl: 256, concurrency: [1, 4, 8], prompts_per_concurrency: 2, enabled: false }
  # Very long context, shaped by TraceLab (arxiv.org/abs/2606.30560): a median coding-agent step resends ~120K tokens
  # of history, adds ~900 new and writes ~250. These need a server with 128K of context:
  #   ./bench.py run spark --max-model-len 131072 -w ctx-64k -w ctx-128k -w agent-64k -w agent-128k
  # ctx-*: a fresh prompt, after one unmeasured warm-up at that length; agent-*: the same history with 1K new tokens.
  # 128K is 131072 - 256, so prompt and reply fit models whose limit is exactly 131072.
  - { name: ctx-64k,    isl: 65536,  osl: 256, concurrency: [1], prompts_per_concurrency: 2, warmup: true, enabled: false }
  - { name: ctx-128k,   isl: 130816, osl: 256, concurrency: [1], prompts_per_concurrency: 2, warmup: true, enabled: false }
  - { name: agent-64k,  isl: 65536,  prefix: 64512,  osl: 256, concurrency: [1, 4], prompts_per_concurrency: 2, enabled: false }
  - { name: agent-128k, isl: 130816, prefix: 129792, osl: 256, concurrency: [1, 4], prompts_per_concurrency: 2, enabled: false }

defaults:
  prompts_per_concurrency: 4          # num_prompts = max(min_prompts, this * concurrency)
  min_prompts: 4
  warmup_prompts: 2                   # discarded run at the start of each model
  backend: openai                     # /v1/completions; use openai-chat for chat-only servers
  temperature: 0                      # greedy, sent explicitly: vllm bench serve >= 0.30 sends none, so servers
                                      # used their default (1.0, no top-k), which moves TT bundles to host sampling
  serve_timeout_s: 14400              # the first serve downloads weights and compiles kernels
  request_timeout_s: 3600
