# What gets benchmarked: machines (hardware and how models are served on them), models, and workloads.
# How to reach your machines (ssh targets, power plugs, interconnect addresses) goes in machines.yaml, which is
# merged over `machines` below and not committed: start from machines.example.yaml.

machines:
  qb2:
    label: QuietBox 2
    family: Tenstorrent               # systems are grouped by family on the page
    hardware: "Tenstorrent QuietBox 2 (2x p300c, 4x Blackhole)"
    launcher: tt                      # tt serve / tt model stop
    bench_python: ~/bench/.venv/bin/vllm   # vllm CLI for `vllm bench serve` (a venv with vllm installed)
    remote_dir: ~/bench
    port: 8000
  p150:                               # one p150 card in a workstation; models need a p150 build (per_machine.p150)
    label: Tenstorrent p150
    family: Tenstorrent
    hardware: "Tenstorrent p150a (1x Blackhole, 32 GB GDDR6) in a workstation"
    launcher: tt
    bench_python: ~/bench/.venv/bin/vllm
    remote_dir: ~/bench
    port: 8000
  n300:                               # one n300 card (2 Wormhole chips) in a workstation; models need an n300 build (per_machine.n300)
    label: Tenstorrent n300
    family: Tenstorrent
    hardware: "Tenstorrent n300d (2x Wormhole, 24 GB GDDR6) in a workstation"
    launcher: tt
    bench_python: ~/bench/.venv/bin/vllm
    remote_dir: ~/bench
    port: 8000
  spark:
    label: DGX Spark
    family: NVIDIA
    hardware: "NVIDIA DGX Spark (GB10, 128 GB unified)"
    launcher: vllm-docker             # vllm serve in NVIDIA's container; the client runs in the same container
    image: nvcr.io/nvidia/vllm:26.09-py3
    bench_python: ~/bench/vllm-client.sh
    remote_dir: ~/bench
    port: 8000
  spark-pair:                         # two Sparks as one server over the direct QSFP cable (200 Gb/s)
    label: 2x DGX Spark
    family: NVIDIA
    hardware: "2x NVIDIA DGX Spark (GB10), QSFP 200 Gb/s, tensor parallel 2"
    launcher: vllm-docker
    image: nvcr.io/nvidia/vllm:26.09-py3
    tp: 2
    bench_python: ~/bench/vllm-client.sh
    remote_dir: ~/bench
    port: 8000
  rtx6000:                            # one Quadro RTX 6000 (Turing, 24 GB) in a workstation; no bf16 on Turing, so models run in fp16
    label: Quadro RTX 6000
    family: NVIDIA
    hardware: "NVIDIA Quadro RTX 6000 (Turing, 24 GB GDDR6) in a workstation"
    launcher: vllm-docker
    image: nvcr.io/nvidia/vllm:26.04-py3
    bench_python: ~/bench/vllm-client.sh
    remote_dir: ~/bench
    port: 8000
  mac:                                # any Apple silicon Mac; copy this entry for your model of Mac (see CONTRIBUTING.md)
    label: Mac mini (M5 Pro)
    family: Apple
    hardware: "Apple Mac mini (M5 Pro, 64 GB unified memory)"
    launcher: mlx                     # mlx_lm.server, run with uvx
    client: builtin                   # tools/loadgen.py: vllm has no macOS build
    models_from: mac                  # use the `mac` entries under each model's per_machine
    remote_dir: ~/bench
    port: 8080
  strix-halo:                         # AMD Ryzen AI Max+ 395; copy this entry for your machine (see issue #2). Untested
    label: Ryzen AI Max+ 395
    family: AMD
    hardware: "AMD Ryzen AI Max+ 395 (Radeon 8060S, 128 GB unified memory)"
    launcher: vllm-docker
    gpu: rocm                         # AMD GPU devices instead of --gpus all; amd-smi/rocm-smi for meta.json
    image: rocm/vllm:latest           # replace with a vLLM ROCm image that supports your GPU (gfx1151 for Strix Halo)
    bench_python: ~/bench/vllm-client.sh
    models_from: spark                # the Spark's Hugging Face builds (its NVFP4 Nemotron build needs NVIDIA)
    remote_dir: ~/bench
    port: 8000
  framework-desktop-128gb:
    label: Framework Desktop (Ryzen AI Max+ 395)
    family: AMD
    hardware: "Framework Desktop (AMD Ryzen AI Max+ 395, Radeon 8060S, 128 GB unified memory, 96 GiB GTT)"
    launcher: vllm-docker
    gpu: rocm
    image: docker.io/kyuz0/vllm-therock-gfx1151@sha256:8002236ea7526491cf9b0b6a543408fb0be2baacbba656effc132aba2e44dd1d
    bench_python: ~/bench/vllm-client.sh
    remote_dir: ~/bench
    port: 8000

# One entry per model. `hf_id` is the canonical weights repo and the tokenizer the client builds prompts with.
# arch, params_b and weights describe the model for the page; quality is the published Artificial Analysis
# Intelligence Index (https://artificialanalysis.ai, v4.3.2, read 2026-10-13), not something measured here.
# per_machine.<machine>.serve is what the launcher serves: a tt catalog name or tt-model bundle, a Hugging Face
# repo for vLLM, or an MLX repo; weights_gb (Mac) is the MLX download, used to skip models that don't fit.
models:
  - id: qwen3.6-27b
    hf_id: Qwen/Qwen3.6-27B
    arch: Dense
    params_b: { total: 27.8, active: 27.8 }
    weights: BF16
    quality: { aa_index: 21, variant: Reasoning, version: v4.3.2, url: "https://artificialanalysis.ai/models/qwen3-6-27b" }
    per_machine:
      qb2: { serve: Qwen3.6-27B, source: tt-inference-server }
      spark: { serve: Qwen/Qwen3.6-27B, args: [--max-model-len, '40960', --gpu-memory-utilization, '0.80'], max_concurrency: null }
      mac: { serve: mlx-community/Qwen3.6-27B-4bit, weights: MLX 4-bit, weights_gb: 16.1 }

  - id: qwen3-coder-30b-a3b
    hf_id: Qwen/Qwen3-Coder-30B-A3B-Instruct
    arch: MoE
    params_b: { total: 30.5, active: 3.3 }
    weights: BF16
    quality: { aa_index: 10, variant: Non-reasoning, estimate: true, version: v4.3.2, url: "https://artificialanalysis.ai/models/qwen3-coder-30b-a3b-instruct" }
    per_machine:
      qb2: { serve: raahemnabeel/qwen3-coder-30b-a3b-blackhole-fast, profile: p300x2 }   # 2026-10-27 fused-decode build
      spark: { serve: Qwen/Qwen3-Coder-30B-A3B-Instruct, args: [--max-model-len, '40960', --gpu-memory-utilization, '0.80'], max_concurrency: null }
      mac: { serve: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit, weights: MLX 4-bit, weights_gb: 17.2 }

  - id: devstral-small-2-24b
    hf_id: mistralai/Devstral-Small-2-24B-Instruct-2512
    arch: Dense
    params_b: { total: 24, active: 24 }
    weights: BF16
    quality: { aa_index: 8, variant: Non-reasoning, version: v4.3.2, url: "https://artificialanalysis.ai/models/devstral-small-2" }
    per_machine:
