    weights: BF16
    quality: { aa_index: 15, variant: Reasoning, version: v4.3.2, url: "https://artificialanalysis.ai/models/gemma-4-31b" }
    per_machine:
      qb2: { serve: gemma-4-31B-it, source: tt-inference-server }
      spark: { serve: google/gemma-4-31B-it, args: [--max-model-len, '40960', --gpu-memory-utilization, '0.80'], max_concurrency: null }
