<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  /* stand-ins for the dashboard runtime's theme tokens */
  :root {
    color-scheme: light;
    --font-anthropic-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-anthropic-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --color-fg: #1c2027; --color-fg-muted: #5a6170; --color-bg: #f5f6f8; --color-panel: #ffffff;
    --color-border-line: #e1e4ea; --color-ok: #1f7a4d; --color-warn: #9a6200; --color-bad: #c0392b;
    --cds-text-secondary: #6b7280; --cds-surface-popover: #ffffff; --cds-border: #dfe2e8;
    --cds-shadow-popover: 0 6px 24px rgba(20, 24, 33, 0.12);
    --cds-chart-grid: #e8eaef; --cds-chart-axis: #b7bcc6; --cds-chart-reference: #8b92a0; --cds-chart-muted: #b6bcc7;
    --cds-chart-status-critical: #c0392b;
    --cds-radius: 10px;
    --cds-gap-xs: 0.25rem; --cds-gap-sm: 0.5rem; --cds-gap-md: 1rem; --cds-gap-lg: 1.5rem; --cds-gap-xl: 2.5rem;
    --cds-pad-xs: 0.25rem; --cds-pad-sm: 0.5rem; --cds-pad-md: 0.75rem; --cds-pad-lg: 1.25rem; --cds-pad-xl: 2rem;
    --cds-font-size-caption: 0.8125rem; --cds-font-size-body: 0.9375rem; --cds-font-size-heading: 1.0625rem;
    --cds-font-size-title: 1.75rem; --cds-font-weight-medium: 600;
    --cds-dur-slow: 300ms; --cds-ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --color-fg: #e8eaee; --color-fg-muted: #a3a9b5; --color-bg: #12151a; --color-panel: #1b1f26;
      --color-border-line: #2c323c; --color-ok: #4cc38a; --color-warn: #e0a83a; --color-bad: #ef6b5b;
      --cds-text-secondary: #9aa1ad; --cds-surface-popover: #22272f; --cds-border: #353c47;
      --cds-shadow-popover: 0 6px 24px rgba(0, 0, 0, 0.5);
      --cds-chart-grid: #262b34; --cds-chart-axis: #4a515d; --cds-chart-reference: #7d8594; --cds-chart-muted: #59606c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --color-fg: #e8eaee; --color-fg-muted: #a3a9b5; --color-bg: #12151a; --color-panel: #1b1f26;
    --color-border-line: #2c323c; --color-ok: #4cc38a; --color-warn: #e0a83a; --color-bad: #ef6b5b;
    --cds-text-secondary: #9aa1ad; --cds-surface-popover: #22272f; --cds-border: #353c47;
    --cds-shadow-popover: 0 6px 24px rgba(0, 0, 0, 0.5);
    --cds-chart-grid: #262b34; --cds-chart-axis: #4a515d; --cds-chart-reference: #7d8594; --cds-chart-muted: #59606c;
  }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans);
         font-size: var(--cds-font-size-body); padding: 2rem max(16px, 4vw) 3rem; }
  #dash-root { max-width: 1180px; margin-inline: auto; }
  .dash-skeleton:empty { min-height: 1em; }
  .qx-foot { margin-top: var(--cds-gap-xl); padding-top: var(--cds-gap-md); border-top: 1px solid var(--color-border-line);
             color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.6; display: flex;
             flex-direction: column; gap: var(--cds-gap-sm); max-width: 90ch; }
  .qx-foot a { color: inherit; }
  .qx-foot ul { margin: 0; padding-left: 1.1rem; }
</style>
</head>
<body>
<script>
(() => {
  const RAW = __DATA__;
  const PARAMS = {"users":"16","model":"gpt-oss-120b","price":0.39};
  const calcs = {}, subs = [];
  const colors = ['#2f6fdf', '#13a37a', '#d08a12', '#8a4fd8', '#d64f7a', '#5a6170', '#0f8fb8', '#9a7b1c'];
  const run = () => subs.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
  const data = (id) => {
    if (RAW[id]) return { status: 'ok', data: RAW[id], columns: Object.keys(RAW[id][0] || {}), refreshing: false, meta: [] };
    const c = calcs[id];
    if (c) {
      try { return { status: 'ok', data: c.fn(...c.inputs.map((i) => data(i).data)), refreshing: false, meta: [] }; }
      catch (e) { console.error(e); return { status: 'error', data: [], message: String(e) }; }
    }
    return { status: 'missing', data: [] };
  };
  let params = { ...PARAMS };
  window.dash = {
    colors,
    data,
    calc: (id, spec) => { calcs[id] = spec; },
    loader: () => {},
    onData: (fn) => { subs.push(fn); try { fn(); } catch (e) { console.error(e); } },
    params: () => ({ ...params }),
    setParams: (p) => { params = { ...params, ...p }; run(); },
    resetParams: () => { params = { ...PARAMS }; run(); },
    refresh: () => run(),
    setLink: (name) => { if (name) history.replaceState(null, '', '#' + name); },
  };
  let w = window.innerWidth, t;
  window.addEventListener('resize', () => {
    if (window.innerWidth === w) return;
    w = window.innerWidth; clearTimeout(t); t = setTimeout(run, 150);
  });
})();
</script>
<div id="dash-root">
__PAGE__
</div>
</body>
</html>
